[package]
name = "smpltrckr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
ratatui = "0.30.2"
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
rust-i18n = "4.2.4"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync"] }
unicode-width = "0.2.2"
