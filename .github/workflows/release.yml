# Builds the Linux binaries and publishes a GitHub release when a `v*` tag is pushed.
# Built on Ubuntu 22.04 so the binaries run on any distribution with glibc 2.35 or newer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=smpltrckr-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux
          mkdir "$name"
          strip target/release/smpltrckr
          cp target/release/smpltrckr README.md README.fr.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: smpltrckr-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" smpltrckr-*.tar.gz* \
            --repo "$GITHUB_REPOSITORY" --title "smpltrckr $GITHUB_REF_NAME" --generate-notes
