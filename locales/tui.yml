  en: "Space edit · Enter play · Ctrl+P loop · Ctrl+B tempo · Alt+1…8 mute · Alt+S solo · Alt+0 unmute all · F6 orders · F7 samples · Ctrl+S save · ? help"
  fr: "Espace éditer · Entrée lire · Ctrl+P boucle · Ctrl+B tempo · Alt+1…8 couper · Alt+S solo · Alt+0 tout rétablir · F6 ordre · F7 samples · Ctrl+S enregistrer · ? aide"
  ja: "Space 編集 · Enter 再生 · Ctrl+P ループ · Ctrl+B テンポ · Alt+1…8 ミュート · Alt+S ソロ · Alt+0 全解除 · F6 順番 · F7 サンプル · Ctrl+S 保存 · ? ヘルプ"
