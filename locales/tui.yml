  ja: 取り消し / やり直し
help.title.keys:
  en: Ctrl+T
  fr: Ctrl+T
  ja: Ctrl+T
help.title.what:
  en: song title
  fr: titre du morceau
  ja: 曲のタイトル
help.tempo.keys:
  en: Ctrl+B
  fr: Ctrl+B
  ja: Ctrl+B
help.tempo.what:
  en: tempo (BPM) and speed at the start of the song
  fr: tempo (BPM) et vitesse au début du morceau
