edit.position_removed:
  en: "position %{position} removed"
  fr: "position %{position} retirée"
  ja: "ポジション %{position} を削除"
edit.sample_volume:
  en: "sample %{sample}: volume %{volume}"
  fr: "sample %{sample} : volume %{volume}"
  ja: "サンプル %{sample}: 音量 %{volume}"
edit.sample_finetune:
  en: "sample %{sample}: finetune %{finetune}"
  fr: "sample %{sample} : finetune %{finetune}"
  ja: "サンプル %{sample}: ファインチューン %{finetune}"
edit.sample_cleared:
  en: "sample %{sample} cleared"
  fr: "sample %{sample} vidé"
  ja: "サンプル %{sample} を空に"
edit.sample_renamed:
  en: "sample %{sample} renamed « %{name} »"
  fr: "sample %{sample} renommé « %{name} »"
