help.journal.keys:
  en: F8
  fr: F8
  ja: F8
help.journal.what:
  en: "journal: who did what (you or the agent)"
  fr: "journal : qui a fait quoi (toi ou l'agent)"
  ja: "履歴: 誰が何をしたか（あなたかエージェントか）"
help.quit.keys:
