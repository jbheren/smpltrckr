# --- Key hints (bottom line): "key action · key action …" ------------------------------------
hint.edit:
  en: "Space listen · piano-keys notes · 0-9/A-F sample/effect · Del clear · Enter play · Alt+1…8 mute · Alt+S solo · Alt+0 unmute all · F6 orders · F7 samples · ? help"
  fr: "Espace écoute · clavier-piano notes · 0-9/A-F sample/effet · Suppr effacer · Entrée lire · Alt+1…8 couper · Alt+S solo · Alt+0 tout rétablir · F6 ordre · F7 samples · ? aide"
  ja: "Space 試聴 · ピアノキー 音符 · 0-9/A-F サンプル/エフェクト · Del 消去 · Enter 再生 · Alt+1…8 ミュート · Alt+S ソロ · Alt+0 全解除 · F6 順番 · F7 サンプル · ? ヘルプ"
