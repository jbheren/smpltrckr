help.zones.what:
  en: "active zone: pattern, order list, samples"
  fr: "zone active : pattern, liste d'ordre, samples"
  ja: "操作エリア: パターン、順番リスト、サンプル"
help.orders.keys:
  en: "orders: ← → Ins Del Enter"
  fr: "ordre : ← → Inser Suppr Entrée"
