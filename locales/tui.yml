edit.sample_loaded:
  en: "sample %{sample}: %{name} loaded"
  fr: "sample %{sample} : %{name} chargé"
  ja: "サンプル %{sample}: %{name} を読み込み"
edit.tempo:
  en: "tempo %{bpm} BPM"
  fr: "tempo %{bpm} BPM"
  ja: "テンポ %{bpm} BPM"
edit.tempo_speed:
  en: "tempo %{bpm} BPM, speed %{speed}"
  fr: "tempo %{bpm} BPM, vitesse %{speed}"
