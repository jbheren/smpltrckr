  fr: "↑↓ position · ←→ pattern (crée le suivant) · Inser ajouter · Suppr retirer · Entrée éditer · F5 pattern"
  ja: "↑↓ ポジション · ←→ パターン（次を作成） · Ins 追加 · Del 削除 · Enter 編集 · F5 パターン"
