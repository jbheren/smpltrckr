_version: 2

# --- Status line -----------------------------------------------------------------------------
status.agent:
  en: "agent: %{what}"
  fr: "agent : %{what}"
  ja: "エージェント: %{what}"
status.live:
  en: "agents can join this session (smpltrckr mcp)"
  fr: "un agent peut rejoindre cette session (smpltrckr mcp)"
  ja: "エージェントがこのセッションに参加できます（smpltrckr mcp）"
status.no_live:
  en: "no live agent session: %{error}"
  fr: "pas de session agent en direct : %{error}"
  ja: "エージェントとのライブセッションなし: %{error}"
status.help_hint:
  en: "? : help"
  fr: "? : aide"
  ja: "? : ヘルプ"
status.welcome:
  en: "keyboard %{layout} (F3 to change) · ? : help"
  fr: "clavier %{layout} (F3 pour changer) · ? : aide"
  ja: "キーボード %{layout}（F3 で切替）· ? : ヘルプ"
status.no_audio:
  en: "no audio output: %{error}"
  fr: "pas de sortie audio : %{error}"
  ja: "オーディオ出力がありません: %{error}"
status.unknown_layout:
  en: "unknown keyboard %{layout}: qwerty, azerty or qwertz"
  fr: "clavier inconnu %{layout} : qwerty, azerty ou qwertz"
  ja: "不明なキーボード %{layout}: qwerty、azerty、qwertz のいずれか"
status.unknown_theme:
  en: "unknown theme %{theme}: omarchy or classic"
  fr: "thème inconnu %{theme} : omarchy ou classic"
  ja: "不明なテーマ %{theme}: omarchy または classic"
status.quit_unsaved:
  en: "song not saved: Ctrl+Q again to quit"
  fr: "morceau non enregistré : Ctrl+Q encore pour quitter"
  ja: "曲が保存されていません。もう一度 Ctrl+Q で終了"
status.open_unsaved:
  en: "song not saved: Ctrl+O again to open anyway"
  fr: "morceau non enregistré : Ctrl+O encore pour ouvrir quand même"
  ja: "曲が保存されていません。もう一度 Ctrl+O で開きます"
status.undone:
  en: "undone: %{what}"
  fr: "annulé : %{what}"
  ja: "取り消し: %{what}"
status.redone:
  en: "redone: %{what}"
  fr: "rétabli : %{what}"
  ja: "やり直し: %{what}"
status.nothing_to_undo:
  en: nothing to undo
  fr: rien à annuler
  ja: 取り消せる操作はありません
status.nothing_to_redo:
  en: nothing to redo
  fr: rien à rétablir
  ja: やり直せる操作はありません
status.edit_mode:
  en: edit mode
  fr: mode édition
  ja: 編集モード
status.listen_mode:
  en: listen mode
  fr: mode écoute
  ja: 試聴モード
status.listen_mode_hint:
  en: "listen mode: Space to edit"
  fr: "mode écoute : Espace pour éditer"
  ja: "試聴モード: Space で編集"
status.layout:
  en: "keyboard %{layout}"
  fr: "clavier %{layout}"
  ja: "キーボード %{layout}"
status.note_out_of_range:
  en: note outside octaves 1 to 3
  fr: note hors des octaves 1 à 3
  ja: 音符がオクターブ 1〜3 の範囲外です
status.sample_max:
  en: "sample %{sample}: 31 at most"
  fr: "sample %{sample} : 31 au plus"
  ja: "サンプル %{sample}: 最大 31 です"
status.max_positions:
  en: 128 positions at most
  fr: 128 positions au plus
  ja: ポジションは最大 128 です
status.min_positions:
  en: the order list keeps at least one position
  fr: la liste d'ordre garde au moins une position
  ja: 順番リストには最低 1 ポジション必要です
status.bad_tempo:
  en: "unreadable tempo %{text}: e.g. « 140 » or « 140 6 »"
  fr: "tempo illisible %{text} : ex. « 140 » ou « 140 6 »"
  ja: "テンポが読めません %{text}（例:「140」または「140 6」）"
status.sample_info:
  en: "%{bytes} bytes, %{rate} Hz"
  fr: "%{bytes} octets, %{rate} Hz"
  ja: "%{bytes} バイト、%{rate} Hz"
status.natural_note:
  en: ", original pitch at %{note}"
  fr: ", hauteur d'origine en %{note}"
  ja: "、元の音程は %{note}"
status.truncated:
  en: ", TRUNCATED to 128 KB"
  fr: ", TRONQUÉ à 128 Ko"
  ja: "、128 KB に切り詰めました"
status.loaded:
  en: "%{name}: %{info}"
  fr: "%{name} : %{info}"
  ja: "%{name}: %{info}"
status.file_error:
  en: "%{path}: %{error}"
  fr: "%{path} : %{error}"
  ja: "%{path}: %{error}"
status.opened:
  en: "%{path} opened"
  fr: "%{path} ouvert"
  ja: "%{path} を開きました"
status.saved:
  en: "saved: %{path}"
  fr: "enregistré : %{path}"
  ja: "保存しました: %{path}"
status.write_error:
  en: "cannot write %{path}: %{error}"
  fr: "écriture de %{path} impossible : %{error}"
  ja: "%{path} に書き込めません: %{error}"

# --- Journal (keyboard side) -----------------------------------------------------------------
journal.opened:
  en: "opened %{path}"
  fr: "ouverture de %{path}"
  ja: "%{path} を開く"
journal.saved:
  en: "saved to %{path}"
  fr: "enregistrement dans %{path}"
  ja: "%{path} に保存"

