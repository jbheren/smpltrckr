# --- Help page: keys -------------------------------------------------------------------------
help.play.keys:
  en: Enter
  fr: Entrée
  ja: Enter
help.play.what:
  en: play / stop the song from the position
  fr: lire / arrêter le morceau depuis la position
  ja: ポジションから曲を再生 / 停止
help.loop.keys:
  en: Ctrl+P
  fr: Ctrl+P
  ja: Ctrl+P
help.loop.what:
  en: loop the pattern
  fr: lire le pattern en boucle
  ja: パターンをループ再生
help.stop.keys:
  en: Esc
  fr: Échap
  ja: Esc
help.stop.what:
  en: stop playback and the notes being listened to
  fr: arrêter la lecture et les notes écoutées
  ja: 再生と試聴中の音を止める
help.edit.keys:
  en: Space
  fr: Espace
  ja: Space
help.edit.what:
  en: edit mode (otherwise notes only sound)
  fr: mode édition (sinon, les notes ne font que sonner)
  ja: 編集モード（オフのときは音が鳴るだけ）
help.notes.keys:
  en: bottom and top rows
  fr: rangées du bas et du haut
  ja: 下段と上段のキー
help.notes.what:
  en: notes (piano keys, two octaves, following the layout)
  fr: notes (clavier piano, deux octaves, selon la disposition)
  ja: 音符（ピアノ配置、2 オクターブ、キー配列に従う）
help.octave.keys:
  en: F1 / F2
  fr: F1 / F2
  ja: F1 / F2
help.octave.what:
  en: octave of the piano keys
  fr: octave du clavier piano
  ja: ピアノキーのオクターブ
help.layout.keys:
  en: F3
  fr: F3
  ja: F3
help.layout.what:
  en: "keyboard layout: QWERTY, AZERTY, QWERTZ"
  fr: "disposition du clavier : QWERTY, AZERTY, QWERTZ"
  ja: "キー配列: QWERTY、AZERTY、QWERTZ"
help.sample.keys:
  en: "[ ]"
  fr: "[ ]"
  ja: "[ ]"
help.sample.what:
  en: "current sample (in the samples panel: finetune)"
  fr: "sample courant (dans les samples : finetune)"
  ja: "現在のサンプル（サンプル欄ではファインチューン）"
help.move.keys:
  en: arrows, PgUp/PgDn
  fr: flèches, PgPréc/PgSuiv
  ja: 矢印、PgUp/PgDn
help.move.what:
  en: "move; Tab / Shift+Tab: next / previous voice"
  fr: "se déplacer ; Tab / Maj+Tab : voie suivante / précédente"
  ja: "移動。Tab / Shift+Tab: 次 / 前のチャンネル"
help.digits.keys:
  en: 0-9 A-F
  fr: 0-9 A-F
  ja: 0-9 A-F
help.digits.what:
  en: sample (decimal) and effect (hex), depending on the column
  fr: sample (décimal) et effet (hexadécimal) selon la colonne
  ja: 列に応じてサンプル（10 進）とエフェクト（16 進）
help.clear.keys:
  en: Del / Backspace
  fr: Suppr / Retour arrière
  ja: Del / Backspace
help.clear.what:
  en: clear the field / the cell
  fr: effacer le champ / la cellule
  ja: 欄 / セルを消去
help.rows.keys:
  en: Ins / Ctrl+K
  fr: Inser / Ctrl+K
  ja: Ins / Ctrl+K
help.rows.what:
  en: insert / delete a row in the voice
  fr: insérer / supprimer une ligne dans la voie
  ja: チャンネル内で行を挿入 / 削除
help.mute.keys:
  en: Alt+1 … Alt+8
  fr: Alt+1 … Alt+8
  ja: Alt+1 … Alt+8
help.mute.what:
  en: mute / unmute a voice
  fr: couper / rétablir une voie
  ja: チャンネルのミュート / 解除
help.solo.keys:
  en: Alt+S / Alt+0
  fr: Alt+S / Alt+0
