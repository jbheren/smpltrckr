_version: 2

# --- What the effect under the cursor does, with its values ----------------------------------
effect.slide_up:
  en: "up by %{amount} per tick"
  fr: "monte de %{amount} à chaque tick"
  ja: "ティックごとに %{amount} 上げる"
effect.slide_down:
  en: "down by %{amount} per tick"
  fr: "baisse de %{amount} à chaque tick"
  ja: "ティックごとに %{amount} 下げる"
effect.arpeggio:
  en: "arpeggio: note, +%{x} and +%{y} semitones"
  fr: "arpège : note, +%{x} et +%{y} demi-tons"
  ja: "アルペジオ: 元の音、+%{x}、+%{y} 半音"
effect.porta_up:
  en: "pitch slides up by %{amount} per tick"
  fr: "la hauteur monte de %{amount} à chaque tick"
  ja: "ティックごとに音程を %{amount} 上げる"
effect.porta_down:
  en: "pitch slides down by %{amount} per tick"
  fr: "la hauteur descend de %{amount} à chaque tick"
  ja: "ティックごとに音程を %{amount} 下げる"
effect.glide:
  en: "glide to the written note, speed %{speed}"
  fr: "glisse vers la note écrite, vitesse %{speed}"
  ja: "書かれた音へポルタメント、速さ %{speed}"
effect.glide_previous:
  en: "glide to the written note, previous speed"
  fr: "glisse vers la note écrite, vitesse précédente"
  ja: "書かれた音へポルタメント（前回の速さ）"
effect.vibrato:
  en: "vibrato: speed %{speed}, depth %{depth}"
  fr: "vibrato : vitesse %{speed}, profondeur %{depth}"
  ja: "ビブラート: 速さ %{speed}、深さ %{depth}"
effect.glide_slide:
  en: "glide (previous speed) + volume %{slide}"
  fr: "glissé (vitesse précédente) + volume qui %{slide}"
  ja: "ポルタメント（前回の速さ）+ 音量を%{slide}"
effect.vibrato_slide:
  en: "vibrato (previous values) + volume %{slide}"
  fr: "vibrato (valeurs précédentes) + volume qui %{slide}"
  ja: "ビブラート（前回の値）+ 音量を%{slide}"
effect.tremolo:
  en: "tremolo: speed %{speed}, depth %{depth}"
  fr: "trémolo : vitesse %{speed}, profondeur %{depth}"
  ja: "トレモロ: 速さ %{speed}、深さ %{depth}"
effect.ignored:
  en: "%{name}: ignored by smpltrckr"
  fr: "%{name} : ignoré par smpltrckr"
  ja: "%{name}: smpltrckr では無視されます"
effect.offset:
  en: "start the sample at byte %{bytes}"
  fr: "démarre le sample à l'octet %{bytes}"
  ja: "サンプルを %{bytes} バイト目から再生"
effect.volume_slide:
  en: "volume slide: %{slide}"
  fr: "glissement de volume : %{slide}"
  ja: "音量スライド: %{slide}"
effect.jump:
  en: "jump to position %{position}"
  fr: "saute à la position %{position}"
  ja: "ポジション %{position} へジャンプ"
effect.volume:
  en: "volume %{volume} (of 64)"
  fr: "volume %{volume} (sur 64)"
  ja: "音量 %{volume}（最大 64）"
effect.break:
  en: "end of pattern: next position, row %{row}"
  fr: "fin du pattern : position suivante, ligne %{row}"
  ja: "パターン終了: 次のポジションの %{row} 行目へ"
effect.fine_up:
  en: "pitch up by %{amount}, once"
  fr: "hauteur +%{amount}, une seule fois"
  ja: "音程を %{amount} 上げる（1 回だけ）"
effect.fine_down:
  en: "pitch down by %{amount}, once"
  fr: "hauteur -%{amount}, une seule fois"
  ja: "音程を %{amount} 下げる（1 回だけ）"
effect.vibrato_wave:
  en: "vibrato waveform: %{wave}"
  fr: "forme du vibrato : %{wave}"
  ja: "ビブラートの波形: %{wave}"
effect.tremolo_wave:
  en: "tremolo waveform: %{wave}"
  fr: "forme du trémolo : %{wave}"
  ja: "トレモロの波形: %{wave}"
effect.finetune:
  en: "note finetune %{value}"
  fr: "finetune de la note %{value}"
  ja: "音のファインチューン %{value}"
effect.loop_start:
  en: "pattern loop start"
  fr: "début de boucle de pattern"
  ja: "パターンループの開始点"
effect.loop:
  en: "play again %{times} times from the loop start"
  fr: "rejoue %{times} fois depuis le début de boucle"
  ja: "ループ開始点から %{times} 回繰り返す"
effect.retrigger:
  en: "retrigger the note every %{ticks} ticks"
  fr: "relance la note tous les %{ticks} ticks"
  ja: "%{ticks} ティックごとに音を鳴らし直す"
effect.fine_volume_up:
  en: "volume +%{amount}, once"
  fr: "volume +%{amount}, une seule fois"
  ja: "音量 +%{amount}（1 回だけ）"
effect.fine_volume_down:
  en: "volume -%{amount}, once"
  fr: "volume -%{amount}, une seule fois"
  ja: "音量 -%{amount}（1 回だけ）"
effect.cut:
  en: "cut the note at tick %{tick}"
  fr: "coupe la note au tick %{tick}"
  ja: "%{tick} ティック目で音を切る"
effect.delay:
  en: "delay the note to tick %{tick}"
  fr: "retarde la note au tick %{tick}"
  ja: "%{tick} ティック目まで音を遅らせる"
effect.repeat_row:
  en: "repeat the row %{times} times"
  fr: "répète la ligne %{times} fois"
  ja: "行を %{times} 回繰り返す"
effect.stop:
  en: "stop the song"
  fr: "arrête le morceau"
  ja: "曲を止める"
effect.speed:
  en: "speed %{speed} ticks per row"
  fr: "vitesse %{speed} ticks par ligne"
  ja: "スピード: 1 行 %{speed} ティック"
effect.tempo:
  en: "tempo %{bpm} BPM"
  fr: "tempo %{bpm} BPM"
  ja: "テンポ %{bpm} BPM"
effect.wave.sine:
  en: sine
  fr: sinus
  ja: サイン波
effect.wave.ramp:
  en: ramp
  fr: rampe
  ja: のこぎり波
effect.wave.square:
  en: square
  fr: carré
  ja: 矩形波
effect.wave.no_reset:
  en: "%{wave}, not reset on new notes"
  fr: "%{wave}, sans réinitialisation aux nouvelles notes"
  ja: "%{wave}（新しい音でリセットしない）"

