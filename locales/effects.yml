# --- Help page: effects ("code  description") ------------------------------------------------
effect.help.0:
  en: "0xy  arpeggio: note, +x, +y semitones on every tick (chords: 037 minor, 047 major)"
  fr: "0xy  arpège : note, +x, +y demi-tons à chaque tick (accords : 037 mineur, 047 majeur)"
  ja: "0xy  アルペジオ: ティックごとに元の音、+x、+y 半音（和音: 037 短、047 長）"
effect.help.1:
  en: "1xx  pitch slides up by xx per tick"
  fr: "1xx  la hauteur monte de xx à chaque tick"
  ja: "1xx  ティックごとに音程を xx 上げる"
effect.help.2:
  en: "2xx  pitch slides down by xx per tick"
  fr: "2xx  la hauteur descend de xx à chaque tick"
  ja: "2xx  ティックごとに音程を xx 下げる"
effect.help.3:
  en: "3xx  glide to the written note at speed xx (the note does not restart)"
  fr: "3xx  glisse vers la note écrite, vitesse xx (la note ne redémarre pas)"
  ja: "3xx  書かれた音へ速さ xx でポルタメント（音は鳴り直さない）"
effect.help.4:
  en: "4xy  vibrato: speed x, depth y"
  fr: "4xy  vibrato : vitesse x, profondeur y"
  ja: "4xy  ビブラート: 速さ x、深さ y"
effect.help.5:
  en: "5xy  glide (3) + volume slide (A)"
  fr: "5xy  glissé (3) + glissement de volume (A)"
  ja: "5xy  ポルタメント（3）+ 音量スライド（A）"
effect.help.6:
  en: "6xy  vibrato (4) + volume slide (A)"
  fr: "6xy  vibrato (4) + glissement de volume (A)"
  ja: "6xy  ビブラート（4）+ 音量スライド（A）"
effect.help.7:
  en: "7xy  tremolo: speed x, depth y"
  fr: "7xy  trémolo : vitesse x, profondeur y"
  ja: "7xy  トレモロ: 速さ x、深さ y"
effect.help.9:
  en: "9xx  start the sample at xx × 256 bytes"
  fr: "9xx  démarre le sample à xx × 256 octets"
  ja: "9xx  サンプルを xx × 256 バイト目から再生"
effect.help.A:
  en: "Axy  volume slide on every tick: +x, or -y when x = 0 (fades)"
  fr: "Axy  glissement de volume à chaque tick : +x, ou -y si x = 0 (fondus)"
  ja: "Axy  ティックごとの音量スライド: +x、x = 0 なら -y（フェード）"
effect.help.B:
  en: "Bxx  jump to position xx of the order list"
  fr: "Bxx  saute à la position xx de la liste d'ordre"
  ja: "Bxx  順番リストのポジション xx へジャンプ"
effect.help.C:
  en: "Cxx  volume, 00 to 40 in hex (= 0 to 64)"
  fr: "Cxx  volume, de 00 à 40 en hexadécimal (= 0 à 64)"
  ja: "Cxx  音量、16 進で 00〜40（= 0〜64）"
effect.help.D:
  en: "Dxy  end of pattern: next position, row xy (decimal)"
  fr: "Dxy  fin du pattern : position suivante, ligne xy (décimal)"
  ja: "Dxy  パターン終了: 次のポジションの xy 行目（10 進）"
effect.help.E1:
  en: "E1x  pitch up by x, once"
  fr: "E1x  hauteur +x, une seule fois"
  ja: "E1x  音程を x 上げる（1 回だけ）"
effect.help.E2:
  en: "E2x  pitch down by x, once"
  fr: "E2x  hauteur -x, une seule fois"
  ja: "E2x  音程を x 下げる（1 回だけ）"
effect.help.E4:
  en: "E4x  vibrato waveform: 0 sine, 1 ramp, 2 square (+4: no reset)"
  fr: "E4x  forme du vibrato : 0 sinus, 1 rampe, 2 carré (+4 : sans réinitialiser)"
  ja: "E4x  ビブラート波形: 0 サイン、1 のこぎり、2 矩形（+4: リセットしない）"
effect.help.E5:
  en: "E5x  note finetune (0 to 7, then 8 to F = -8 to -1)"
  fr: "E5x  finetune de la note (0 à 7, puis 8 à F = -8 à -1)"
  ja: "E5x  音のファインチューン（0〜7、8〜F は -8〜-1）"
effect.help.E6:
  en: "E6x  E60 marks the loop start; E6x plays it again x times"
  fr: "E6x  E60 marque le début de boucle ; E6x la rejoue x fois"
  ja: "E6x  E60 でループ開始点、E6x で x 回繰り返す"
effect.help.E7:
  en: "E7x  tremolo waveform (like E4x)"
  fr: "E7x  forme du trémolo (comme E4x)"
  ja: "E7x  トレモロ波形（E4x と同じ）"
effect.help.E9:
  en: "E9x  retrigger the note every x ticks"
  fr: "E9x  relance la note tous les x ticks"
  ja: "E9x  x ティックごとに音を鳴らし直す"
effect.help.EA:
  en: "EAx  volume +x, once"
  fr: "EAx  volume +x, une seule fois"
  ja: "EAx  音量 +x（1 回だけ）"
effect.help.EB:
  en: "EBx  volume -x, once"
  fr: "EBx  volume -x, une seule fois"
  ja: "EBx  音量 -x（1 回だけ）"
effect.help.EC:
  en: "ECx  cut the note at tick x (short, dry notes)"
  fr: "ECx  coupe la note au tick x (notes courtes et sèches)"
  ja: "ECx  x ティック目で音を切る（短く歯切れよく）"
effect.help.ED:
  en: "EDx  delay the note to tick x"
  fr: "EDx  retarde la note au tick x"
  ja: "EDx  x ティック目まで音を遅らせる"
effect.help.EE:
  en: "EEx  repeat the row x times"
  fr: "EEx  répète la ligne x fois"
  ja: "EEx  行を x 回繰り返す"
effect.help.F:
  en: "Fxx  speed (01 to 1F) or tempo in BPM (20 to FF); F00 stops the song"
  fr: "Fxx  vitesse (01 à 1F) ou tempo en BPM (20 à FF) ; F00 arrête le morceau"
  ja: "Fxx  スピード（01〜1F）またはテンポ BPM（20〜FF）。F00 で曲を停止"
